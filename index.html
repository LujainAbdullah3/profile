  ar:["لوحة بيانات رخص المحلات التجارية لأمانة المدينة المنورة","لوحة بيانات Power BI لتحليل رخص المحلات التجارية الصادرة عن أمانة المدينة المنورة خلال عام 2023. تم تنظيف البيانات وتحويلها باستخدام Power Query، وتطوير لوحة تفاعلية تعرض مؤشرات الأداء الرئيسية بصورة ديناميكية ومرئية."]},
 {id:"940",pdf:"assets/940-reports.pdf",pages:["assets/940-1.webp", "assets/940-2.webp", "assets/940-3.webp"],ins:{"en": ["Across all cities in the Kingdom, the dashboard shows 555.41K reports across 17 municipalities (amanahs), a 97.45% successful closure rate and an average closure time of 3 days.", "Jeddah recorded the most reports (96,325), followed by Makkah (75,628), Al-Ahsa (44,840), Riyadh (44,516) and Asir (42,891). Northern Borders (6,670) and Al-Baha (7,406) recorded the fewest.", "The largest category is “Other” (86K), followed by pothole repair and speed-bump maintenance (63K), lighting pole maintenance (56K), poor cleanliness of public places (46K) and street litter (28K). Together these five total about 279K, roughly half of all reports.", "Satisfaction shows 38.98K satisfied and 16.53K not satisfied, about 70% satisfied. These counts total about 55.5K, far below the 555.41K reports, so satisfaction appears to be recorded for only a small share of reports.", "The Madinah view shows 32.807K reports across 6 municipalities, an 83.73% successful closure rate and a 4-day average closure time. That is a lower closure rate and one more day than the figures for all cities in the Kingdom (97.45% and 3 days).", "Madinah city accounts for 25,255 reports (about 77%) and Yanbu for 2,906. Every other municipality has fewer than 1,000 reports, from Badr (913) down to Al-Eshash (37).", "Monthly reports in the Madinah view rose from about 5,506 in January (5,013 + 493) to 5,936 in February and 16,028 in March, roughly 2.7 times February.", "Reports closed after more than 30 days were 493, 768 and 1,623 in January, February and March, about 9%, 13% and 10% of each month’s total.", "In Madinah, 3.66K reports are satisfied and 2.1K not satisfied, about 64% satisfied, below the share for all cities in the Kingdom of about 70%.", "Madinah’s top five categories are Other (7.4K), lighting pole maintenance (4.6K), pothole repair and speed-bump maintenance (3.2K), poor cleanliness of public places (2.6K) and street asphalt maintenance (1.1K).", "The third page is a report-level table (municipality, classification, creation and closure dates, status, satisfaction). A few visible rows have no closure date or a satisfaction value of “not a resident”, which is worth checking for data quality."], "ar": ["على مستوى جميع مدن المملكة تعرض اللوحة 555.41 ألف بلاغ في 17 أمانة، بنسبة إغلاق ناجح 97.45% ومتوسط زمن إغلاق 3 أيام.", "سجلت جدة أكبر عدد من البلاغات (96,325) تليها مكة (75,628) ثم الأحساء (44,840) والرياض (44,516) وعسير (42,891). وسجلت الحدود الشمالية (6,670) والباحة (7,406) أقل الأعداد.", "أكبر تصنيف هو «أخرى» (86 ألفًا)، يليه إصلاح الحفر وصيانة المطبات (63 ألفًا) ثم صيانة أعمدة الإنارة (56 ألفًا) وتدني نظافة الأماكن العامة (46 ألفًا) والنفايات المبعثرة بالشارع (28 ألفًا). مجموع هذه التصنيفات نحو 279 ألفًا، أي قرابة نصف البلاغات.", "يعرض الرضا 38.98 ألف بلاغ راضٍ و16.53 ألف غير راضٍ، أي نحو 70% راضون. مجموع هذين الرقمين نحو 55.5 ألفًا فقط مقابل 555.41 ألف بلاغ، فيبدو أن الرضا مسجّل لنسبة صغيرة من البلاغات.", "تعرض لوحة المدينة 32.807 ألف بلاغ في 6 بلديات، بنسبة إغلاق ناجح 83.73% ومتوسط إغلاق 4 أيام، وهي نسبة أقل بيوم إضافي مقارنة بمستوى جميع مدن المملكة (97.45% و3 أيام).", "تستحوذ بلدية المدينة المنورة على 25,255 بلاغًا (نحو 77%) وينبع على 2,906، وتقل بقية البلديات عن 1,000 بلاغ، من بدر (913) إلى العشاش (37).", "ارتفعت البلاغات الشهرية في لوحة المدينة من نحو 5,506 في يناير (5,013 + 493) إلى 5,936 في فبراير ثم 16,028 في مارس، أي نحو 2.7 ضعف فبراير.", "بلغت البلاغات المغلقة بعد أكثر من 30 يومًا 493 و768 و1,623 في يناير وفبراير ومارس، أي نحو 9% و13% و10% من إجمالي كل شهر.", "في المدينة هناك 3.66 ألف بلاغ راضٍ و2.1 ألف غير راضٍ، أي نحو 64% راضون، وهي أقل من نسبة جميع مدن المملكة البالغة نحو 70%.", "أعلى خمسة تصنيفات في المدينة: أخرى (7.4 ألف)، صيانة أعمدة الإنارة (4.6 ألف)، إصلاح الحفر وصيانة المطبات (3.2 ألف)، تدني نظافة الأماكن العامة (2.6 ألف)، وصيانة الأسفلت في الشوارع (1.1 ألف).", "الصفحة الثالثة جدول تفصيلي للبلاغات (البلدية، التصنيف، تاريخا الإنشاء والإغلاق، الحالة، الرضا). تظهر صفوف قليلة بلا تاريخ إغلاق أو بقيمة رضا «غير مقيم»، ويستحق ذلك مراجعة جودة البيانات."]},rec:{"en": ["Break down the “Other” category: it is the largest on both pages, so reviewing its report texts and adding specific categories would show decision-makers where the real problems are.", "Prioritize roads, lighting and cleanliness: potholes, lighting poles and public cleanliness are in the top five both across all cities in the Kingdom and in Madinah. Planned preventive maintenance and crew allocation around them could reduce repeat reports.", "Investigate Madinah’s closure gap: compare the 83.73% rate and 4-day average with the level for all cities in the Kingdom (97.45%, 3 days), then break late or open reports down by municipality and category and set closure targets.", "Plan for peaks: March volume was about 2.7 times February. Finding the cause (season, campaign or reporting changes) would help plan staffing in advance.", "Expand satisfaction coverage and follow up unsatisfied cases: ratings seem to exist for few reports, so prompting every closed report for feedback would give more reliable satisfaction measures.", "Validate data entries: reports without closure dates or with unclear satisfaction values should be checked so KPIs stay reliable."], "ar": ["تفكيك تصنيف «أخرى»: هو الأكبر في الصفحتين، ومراجعة نصوص بلاغاته وإضافة تصنيفات محددة ستُظهر لصنّاع القرار مواضع المشكلات الحقيقية.", "إعطاء أولوية للطرق والإنارة والنظافة: الحفر وأعمدة الإنارة ونظافة الأماكن العامة ضمن أعلى خمسة تصنيفات على مستوى جميع مدن المملكة وفي المدينة. وقد يخفف الصيانة الوقائية المخططة وتوزيع الفرق حولها من تكرار البلاغات.", "دراسة فجوة الإغلاق في المدينة: مقارنة نسبة 83.73% ومتوسط 4 أيام بمستوى جميع مدن المملكة (97.45% و3 أيام)، ثم تفكيك البلاغات المتأخرة أو المفتوحة حسب البلدية والتصنيف ووضع مستهدفات للإغلاق.", "الاستعداد لفترات الذروة: كان حجم مارس نحو 2.7 ضعف فبراير. ومعرفة السبب (موسم أو حملة أو تغيير في آلية الإبلاغ) تساعد في تخطيط القوى العاملة مسبقًا.", "توسيع تغطية الرضا ومتابعة غير الراضين: يبدو أن التقييم مسجل لعدد قليل من البلاغات، وطلب التقييم بعد كل إغلاق يعطي مقياس رضا أدق.", "التحقق من إدخالات البيانات: ينبغي مراجعة البلاغات بلا تاريخ إغلاق أو بقيم رضا غير واضحة للحفاظ على موثوقية المؤشرات."]},tags:["Power BI","Power Query","Data Analysis","KPI Development"],
  en:["940 Reports Dashboard – Q1 2024","An interactive Power BI dashboard analyzing 940 municipal service reports during the first quarter of 2024, using public data from the Ministry of Municipal, Rural Affairs and Housing Open Data Platform. It aims to identify recurring problems, analyze report distribution, highlight important patterns, and generate practical recommendations for improving municipal services."],
  ar:["لوحة بيانات بلاغات 940 – الربع الأول 2024","لوحة Power BI تفاعلية لتحليل بلاغات الخدمات البلدية 940 خلال الربع الأول من 2024، باستخدام بيانات مفتوحة من منصة البيانات المفتوحة لوزارة البلديات والإسكان. تهدف إلى رصد المشكلات المتكررة وتحليل توزيع البلاغات وإبراز الأنماط المهمة وتقديم توصيات عملية لتحسين الخدمات البلدية."]},
 {id:"realestate",pdf:"assets/realestate.pdf",pages:["assets/realestate-1.webp"],ins:{"en": ["The dashboard shows about 31K operations across regions, and 10,893 operations in January.", "Of 504 services, 33 were completed fully electronically and 471 partially electronically.", "The Riyadh region has the largest share, 28,525 operations, about 93% of the regional total. Makkah (786) and the Eastern Province (442) are next, then Asir (254), Qassim (165) and Madinah (159).", "The lowest regions are Jazan (48), Najran (43) and Al-Baha (34).", "By sector, the public sector accounts for 87% of operations and the private sector 13%.", "Riyadh’s lead over regions as large as Makkah and the Eastern Province is unusually wide, so it may reflect how operations are recorded rather than real activity alone."], "ar": ["تعرض اللوحة نحو 31 ألف عملية في المناطق، و10,893 عملية في شهر يناير.", "من أصل 504 خدمات، أُنجزت 33 خدمة إلكترونيًا بالكامل و471 خدمة إلكترونيًا جزئيًا.", "تبلغ نسبة منطقة الرياض نحو 93% من إجمالي المناطق (28,525 عملية). تليها مكة المكرمة (786) والشرقية (442) ثم عسير (254) والقصيم (165) والمدينة المنورة (159).", "أقل المناطق جازان (48) ونجران (43) والباحة (34).", "حسب القطاع يمثل القطاع العام 87% من العمليات والقطاع الخاص 13%.", "تقدّم الرياض على مناطق كبيرة مثل مكة المكرمة والشرقية واسع على نحو غير معتاد، وقد يعكس طريقة تسجيل العمليات وليس النشاط الفعلي وحده."]},rec:{"en": ["Verify that regional data is recorded consistently, since the gap between Riyadh and other large regions is unusually wide.", "Find which steps keep 471 of 504 services only partially electronic, and prioritize the steps that would allow full digital completion.", "Look at why Jazan, Najran and Al-Baha have the fewest operations, whether from demand, awareness or access to services.", "Review the public/private sector mix over time to see whether the 87/13 split is stable.", "Add a longer date range, so trends can be compared and not only a snapshot of January."], "ar": ["التحقق من اتساق تسجيل البيانات بين المناطق، فالفجوة بين الرياض والمناطق الكبرى الأخرى واسعة على نحو غير معتاد.", "تحديد الخطوات التي تُبقي 471 من أصل 504 خدمات إلكترونية جزئيًا فقط، وإعطاء أولوية للخطوات التي تتيح الإنجاز الرقمي الكامل.", "دراسة أسباب قلة العمليات في جازان ونجران والباحة، سواء كانت بسبب الطلب أو الوعي أو الوصول إلى الخدمات.", "مراجعة توزيع القطاعين العام والخاص عبر الزمن لمعرفة ما إذا كانت نسبة 87/13 مستقرة.", "إضافة نطاق زمني أطول لمقارنة الاتجاهات وعدم الاكتفاء بصورة شهر يناير."]},tags:["Power BI","Power Query","Data Analysis","Data Visualization"],
  en:["Real Estate General Authority Dashboard","An interactive Power BI dashboard analyzing real estate transactions recorded in January 2024. It presents total transactions across regions, total number of services, digitally and partially digitally completed services, regional transaction distribution, and the regions with the highest transaction volumes."],
  ar:["لوحة بيانات الهيئة العامة للعقار","لوحة Power BI تفاعلية لتحليل الصفقات العقارية المسجلة في يناير 2024. تعرض إجمالي الصفقات على مستوى المناطق، وإجمالي عدد الخدمات، والخدمات المكتملة رقميًا والمكتملة جزئيًا، وتوزيع الصفقات حسب المنطقة، والمناطق الأعلى في حجم الصفقات."]},
 {id:"ksu",pdf:"assets/ksu.pdf",pages:["assets/ksu-1.webp"],ins:{"en": ["The dashboard shows 6.404K faculty members, with appointment dates from 01/01/1999 to 13/12/2024.", "By gender, 3.72K are male (58.06%) and 2.69K are female (41.94%).", "By qualification, doctorates have the largest share at 4.24K, about two-thirds of the total. Bachelor’s degrees account for 0.97K, master’s degrees 0.91K and higher diplomas 0.28K.", "By rank, assistant professors are the largest group (2.53K, about 40%), followed by teaching assistants (1.54K), associate professors (0.92K), professors (0.83K) and lecturers (0.58K).", "By college, Science has the most members (759), followed by Medicine and University Hospitals (676), Education (600), Applied Medical Sciences (498) and Humanities and Social Sciences (458).", "The smallest units are Applied Business Administration (9), Applied Computer Science (11), Applied Engineering (16), the Arabic Linguistics Institute (27) and the Deanships (32).", "The table mixes colleges with administrative units such as the Deanships (32) and Administrations (341), so not every row is an academic college."], "ar": ["تعرض اللوحة 6.404 ألف عضو هيئة تدريس، بتواريخ تعيين من 01/01/1999 إلى 13/12/2024.", "حسب الجنس: 3.72 ألف ذكور (58.06%) و2.69 ألف إناث (41.94%).", "حسب المؤهل تبلغ نسبة الدكتوراه نحو ثلثي الإجمالي (4.24 ألف). ويبلغ البكالوريوس 0.97 ألف والماجستير 0.91 ألف والدبلوم العالي 0.28 ألف.", "حسب الرتبة الأستاذ المساعد هو الفئة الأكبر (2.53 ألف، نحو 40%) يليه المعيد (1.54 ألف) ثم الأستاذ المشارك (0.92 ألف) والأستاذ (0.83 ألف) والمحاضر (0.58 ألف).", "حسب الكلية تتصدر كلية العلوم (759) تليها الطب والمستشفيات الجامعية (676) ثم التربية (600) والعلوم الطبية التطبيقية (498) والعلوم الإنسانية والاجتماعية (458).", "أصغر الوحدات: إدارة الأعمال التطبيقية (9) وعلوم الحاسب التطبيقي (11) والهندسة التطبيقية (16) ومعهد اللغويات العربية (27) والعمادات (32).", "يخلط الجدول بين الكليات والوحدات الإدارية مثل العمادات (32) والإدارات (341)، فليست كل الصفوف كليات أكاديمية."]},rec:{"en": ["Examine gender balance by college and rank to see where the 58/42 split is wider or narrower.", "Review very small units (fewer than 30 members) for staffing resilience and possible consolidation of support.", "Separate colleges from administrative units in the table so comparisons between colleges are fair."], "ar": ["فحص التوازن بين الجنسين حسب الكلية والرتبة لمعرفة أين تتسع أو تضيق نسبة 58/42.", "مراجعة الوحدات الصغيرة جدًا (أقل من 30 عضوًا) من حيث استقرار الكادر وإمكانية دعمها.", "فصل الكليات عن الوحدات الإدارية في الجدول لتكون المقارنات بين الكليات عادلة."]},tags:["Power BI","Statistics","Data Visualization"],
  en:["King Saud University Faculty Statistics Dashboard","A statistical dashboard analyzing faculty member data at King Saud University, showing the distribution of academic staff by gender, academic rank, educational qualification, and number of faculty members in each college. The objective is a clear statistical overview of the academic workforce structure."],
  ar:["لوحة بيانات التحليل الإحصائي لأعضاء هيئة التدريس بجامعة الملك سعود","لوحة إحصائية لتحليل بيانات أعضاء هيئة التدريس بجامعة الملك سعود، تعرض توزيعهم حسب الجنس والرتبة العلمية والمؤهل التعليمي وعدد الأعضاء في كل كلية، بهدف تقديم نظرة إحصائية واضحة على هيكل الكادر الأكاديمي."]},
 {id:"students",pdf:"assets/students-study.pdf",pages:["assets/students-01.webp", "assets/students-02.webp", "assets/students-03.webp", "assets/students-04.webp", "assets/students-05.webp", "assets/students-06.webp", "assets/students-07.webp", "assets/students-08.webp", "assets/students-09.webp", "assets/students-10.webp", "assets/students-11.webp", "assets/students-12.webp"],ins:{"en": ["The study uses a public Kaggle dataset of students’ grades, playing habits, parental income and parents’ education.", "Data preparation: missing values in the “Father Education” column were replaced with the mean, completely repeated rows were removed, and data types were corrected (for example, converting Grade and the percentage column to numeric).", "Parental income: 184 students scored above 70 with an income level above 3, versus 41 who scored above 70 with an income level of 3 or below. Only 4 students scored below 70 with an income level below 3.", "Average grade by income level is 77 for low income, 76 for medium income and 86 for high income. The advantage appears only in the high-income group, not as a gradual rise across levels.", "Playing hours: students who played more than 3 hours a day averaged 72.5, versus 77 for those who played less. Among the heavier players, 18% scored above 80 and 32% below 60; among lighter players, 40% scored above 80 and only 10% below 60.", "The average grade is highest for students who do not play (about 80) and falls to the low 70s at 4–5 hours a day, with a small uptick at 3 hours.", "Mother’s education: 578 students had a grade above 70 with a mother’s education level above 3, versus 342 with a grade below 70 and a mother’s education level below 3.", "Gender: gamers split about evenly (50.9% female, 49.1% male). The female median grade is about 80 versus about 75 for males, and male grades are more spread out (middle half roughly 62–90, versus 70–90 for females). One low outlier appears among females.", "The report itself notes that the relationship between playing hours and grades is not strong enough for definitive conclusions. It relies on group counts and averages and does not report significance tests, so the findings describe associations in this dataset, not causes."], "ar": ["تعتمد الدراسة على مجموعة بيانات عامة من Kaggle تضم درجات الطلاب وعادات اللعب ودخل الأسرة ومستوى تعليم الوالدين.", "تجهيز البيانات: استُبدلت القيم المفقودة في عمود «تعليم الأب» بالمتوسط، وحُذفت الصفوف المكررة بالكامل، وصُححت أنواع البيانات (مثل تحويل الدرجة وعمود النسبة إلى أرقام).", "دخل الأسرة: حصل 184 طالبًا على أكثر من 70 مع مستوى دخل أعلى من 3، مقابل 41 طالبًا حصلوا على أكثر من 70 مع مستوى دخل 3 أو أقل. وحصل 4 طلاب فقط على أقل من 70 مع مستوى دخل أقل من 3.", "متوسط الدرجات حسب مستوى الدخل: 77 للدخل المنخفض و76 للمتوسط و86 للمرتفع. تظهر الأفضلية في فئة الدخل المرتفع فقط، وليس كارتفاع تدريجي عبر المستويات.", "ساعات اللعب: متوسط الطلاب الذين لعبوا أكثر من 3 ساعات يوميًا 72.5 مقابل 77 لمن لعبوا أقل. بين الأكثر لعبًا حصل 18% على أكثر من 80 و32% على أقل من 60، وبين الأقل لعبًا حصل 40% على أكثر من 80 و10% فقط على أقل من 60.", "أعلى متوسط للدرجات عند الطلاب الذين لا يلعبون (نحو 80)، ويتراجع إلى السبعينات المنخفضة عند 4–5 ساعات يوميًا، مع ارتفاع طفيف عند 3 ساعات.", "تعليم الأم: حصل 578 طالبًا على أكثر من 70 مع مستوى تعليم أم أعلى من 3، مقابل 342 طالبًا بدرجة أقل من 70 ومستوى تعليم أم أقل من 3.", "الجنس: توزيع اللاعبين متقارب (50.9% إناث و49.1% ذكور). وسيط درجات الإناث نحو 80 مقابل نحو 75 للذكور، ودرجات الذكور أكثر تشتتًا (النصف الأوسط نحو 62–90 مقابل 70–90 للإناث). وتظهر قيمة شاذة منخفضة واحدة بين الإناث.", "تذكر الدراسة نفسها أن العلاقة بين ساعات اللعب والدرجات ليست قوية بما يكفي لاستنتاجات قاطعة. وهي تعتمد على أعداد ومتوسطات المجموعات ولا تعرض اختبارات دلالة إحصائية، فالنتائج تصف ارتباطات في هذه البيانات وليست أسبابًا."]},rec:{"en": ["Support students from lower-income families through academic and financial programs. The 77 and 76 averages for low and medium income, against 86 for high income, suggest looking beyond the lowest income group.", "Offer time-management training rather than only limiting play: 18% of students playing over 3 hours still scored above 80, so balance matters more than a single cutoff.", "Encourage parental involvement, including raising awareness among mothers about their role, as the report recommends.", "Provide targeted support for male students, whose grades are lower at the median and more spread out."], "ar": ["دعم الطلاب من الأسر ذات الدخل الأقل عبر برامج أكاديمية ومالية. ويشير متوسطا 77 و76 للدخل المنخفض والمتوسط مقابل 86 للمرتفع إلى ضرورة النظر إلى ما هو أبعد من أدنى فئة دخل.", "تقديم تدريب على إدارة الوقت بدلًا من الاكتفاء بتقليل اللعب: فما زال 18% ممن يلعبون أكثر من 3 ساعات يحصلون على أكثر من 80، فالتوازن أهم من حد فاصل واحد.", "تشجيع مشاركة أولياء الأمور، ومنها رفع وعي الأمهات بدورهن، كما توصي الدراسة.", "تقديم دعم موجّه للطلاب الذكور الذين تقل درجاتهم عند الوسيط وتتشتت أكثر."]},tags:["Python","Statistical Analysis","Data Cleaning","Exploratory Data Analysis"],

function bindProject(id){const p=PROJECTS.find(x=>x.id===id);if(!p)return;let i=0;const n=Math.max(p.pages.length,1),g=$("#gal");
 const draw=()=>{g.innerHTML=img(p,i);$("#gn").textContent=(i+1)+" / "+n};
 const go=d=>{i=(i+d+n)%n;draw()};draw();$("#gp").onclick=()=>go(-1);$("#gx").onclick=()=>go(1);
 let x0=0;g.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});g.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)go(d<0?1:-1)});
 g.onclick=()=>{$("#lbc").innerHTML=img(p,i).replace('loading="lazy"','style="max-width:92vw;max-height:90vh"');$("#lb").classList.add("on")}}
$("#lb").onclick=()=>$("#lb").classList.remove("on");
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#lb").classList.remove("on")});
function count(){document.querySelectorAll("[data-n]").forEach(el=>{const n=+el.dataset.n,s=el.dataset.s;let c=0;const step=()=>{c+=Math.max(1,n/30);if(c>=n){el.textContent=n+s;return}el.textContent=Math.floor(c);requestAnimationFrame(step)};step()})}
let cvMissing=false;
async function resume(){const el=$("#rv");if(!el)return;let ok=true;
 if(/^https?:/.test(location.protocol)){try{const r=await fetch(RES,{method:"HEAD"});ok=r.ok}catch(e){ok=false}}
 cvMissing=!ok;
 el.innerHTML=ok?`<object data="${RES}" type="application/pdf" aria-label="${t("res")}"><div class="ph" style="aspect-ratio:16/7;margin:0">${t("resnp")}</div></object>`:`<div class="ph" style="aspect-ratio:16/7">${t("resph")}</div>`;
 const fb=$("#fsb");if(fb)fb.onclick=()=>{const f=$("#rv object");if(f){const q=f.requestFullscreen||f.webkitRequestFullscreen;if(q)q.call(f)}}}
/* CV download link is a plain <a download>; it is disabled only if the PDF file is missing */
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a.dlcv");if(a&&cvMissing)e.preventDefault()});
const ICON={moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>'};
function setTheme(th){theme=th;document.documentElement.dataset.theme=th;const b=$("#themeBtn"),lab=T[lang][th==="dark"?"toL":"toD"];b.innerHTML=th==="dark"?ICON.sun:ICON.moon;b.title=lab;b.setAttribute("aria-label",lab)}
function render(){const h=location.hash.slice(1),pid=h.startsWith("project-")?h.slice(8):null;
 document.documentElement.lang=lang;document.title=t("ptitle");const md=document.querySelector("meta[name=description]");if(md)md.content=t("pdesc");document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.documentElement.dataset.theme=theme;
 const lk=NAV.map(k=>`<a href="#${k}">${t(k)}</a>`).join("");$("#links").innerHTML=lk;$("#flinks").innerHTML=lk;
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 document.querySelectorAll("[data-l]").forEach(b=>{b.classList.toggle("on",b.dataset.l===lang);b.setAttribute("aria-pressed",b.dataset.l===lang)});
 setTheme(theme);
 $("#app").innerHTML=pid?project(pid):home();$("#yr").textContent=new Date().getFullYear();
 if(pid){bindProject(pid);scrollTo(0,0)}else{count();resume();document.querySelectorAll(".job button").forEach(b=>b.onclick=()=>{const j=b.parentElement;j.classList.toggle("open");b.setAttribute("aria-expanded",j.classList.contains("open"))});const a=NAV.includes(h)?document.getElementById(h):null;if(a)a.scrollIntoView()}}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;save("lang",lang);render()});
$("#themeBtn").onclick=()=>{const r=document.documentElement;r.classList.add("tt");setTheme(theme==="dark"?"light":"dark");save("theme",theme);clearTimeout(window._tt);window._tt=setTimeout(()=>r.classList.remove("tt"),600)};
$("#menu").onclick=()=>$("#links").classList.toggle("open");
$("#links").onclick=()=>$("#links").classList.remove("open");
let lastPid=null;addEventListener("hashchange",()=>{const pid=location.hash.startsWith("#project-");if(pid||lastPid){render()}lastPid=pid});
lastPid=location.hash.startsWith("#project-");render();
</script>
</body>
</html>
